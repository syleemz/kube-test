# grafana/grafana 차트 - Loki 데이터소스 프로비저닝 (로컬 학습용)
# Traefik 미설치 환경이라 Ingress 없음. port-forward 로 접근.

adminUser: admin
adminPassword: admin

# 재시작해도 비밀번호/수동 변경이 유지되도록 PVC 사용 (local-path)
persistence:
  enabled: true
  size: 1Gi

service:
  type: ClusterIP

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000

# 시작용 대시보드 (sample-app 로그/에러율). ConfigMap: grafana-dashboard-sample-app.yaml
dashboardProviders:
  dashboards.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
dashboardsConfigMaps:
  default: sample-app-dashboard
