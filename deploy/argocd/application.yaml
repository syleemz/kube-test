apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app
  namespace: argocd
spec:
  project: default
  source:
    # 이 저장소를 GitHub 퍼블릭 레포에 push 한 뒤 URL 교체
    repoURL: https://github.com/syleemz/kube-test.git
    path: deploy/sample-app
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
